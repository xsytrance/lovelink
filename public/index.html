<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoveLink</title>
    <style>
      :root {
        --bg: #fff3fa;
        --surface: rgba(255, 255, 255, 0.75);
        --surface-strong: #ffffff;
        --line: #ffd0e6;
        --pink: #ff5fa2;
        --rose: #ff2f7d;
        --text: #3a1b2d;
        --muted: #8b5f76;
        --shadow: 0 18px 40px rgba(255, 47, 125, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 0%, #ffe0ef 0%, var(--bg) 35%, #fff7fb 100%);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        backdrop-filter: blur(10px);
        background: linear-gradient(120deg, rgba(255, 95, 162, 0.95), rgba(255, 47, 125, 0.95));
        color: #fff;
        box-shadow: 0 10px 24px rgba(255, 47, 125, 0.2);
      }

      .brand { margin: 0; font-size: 1.25rem; letter-spacing: 0.2px; }
      .status { font-size: 0.8rem; font-weight: 700; text-align: right; }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(5px);
      }

      .login-wrap { padding: 14px; }
      .login-card {
        max-width: 480px;
        margin: 14px auto;
        padding: 18px;
      }

      h2, h3 { margin: 0 0 10px; }

      .field {
        width: 100%;
        border-radius: 13px;
        border: 1px solid #e7b0cb;
        padding: 11px 12px;
        margin-bottom: 10px;
        font-size: 0.95rem;
        background: #fff;
        color: var(--text);
      }

      .btn {
        border: 0;
        border-radius: 13px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.2s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn:active { transform: translateY(1px); }
      .btn-primary {
        background: linear-gradient(120deg, var(--pink), var(--rose));
        color: #fff;
      }
      .btn-secondary {
        background: #ffe6f2;
        color: #612743;
        border: 1px solid #ffc2df;
      }

      .error { min-height: 1.2em; color: #b1004e; margin: 0; font-weight: 600; }

      .hidden { display: none !important; }

      /* Mobile first: interaction/memories first for viewer comfort */
      .app {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 12px;
      }

      .interaction { order: 1; padding: 14px; }
      .presence { order: 2; padding: 14px; }

      .video-wrap {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        background: #170812;
        border: 1px solid #ffc2df;
      }

      video {
        width: 100%;
        display: block;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #10050c;
      }

      .controls, .quick-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }

      .mood-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .mood-row select { flex: 1; }

      .eq-wrap {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .eq-label { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
      canvas.equalizer {
        width: 100%;
        height: 80px;
        border-radius: 12px;
        border: 1px solid #ffcce3;
        background: linear-gradient(180deg, #fff, #ffe9f4);
      }

      .typing {
        font-size: 0.82rem;
        color: var(--muted);
        min-height: 1.2em;
      }

      .chat-log {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 260px;
        overflow: auto;
        padding: 8px;
        border-radius: 14px;
        border: 1px solid #ffd4e8;
        background: #fff;
      }

      .chat-item {
        align-self: flex-start;
        max-width: 100%;
        padding: 8px 10px;
        border-radius: 12px 12px 12px 4px;
        background: #fff0f7;
        border: 1px solid #ffd5e8;
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .composer { display: flex; gap: 8px; margin-top: 8px; }
      .composer input { flex: 1; margin: 0; }

      .reaction-row {
        margin-top: 8px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .moments {
        margin-top: 12px;
        display: grid;
        gap: 12px;
        max-height: 360px;
        overflow: auto;
        padding-right: 2px;
      }

      .moment {
        border-radius: 18px;
        border: 1px solid #ffc7e1;
        background: linear-gradient(165deg, #fff 0%, #fff6fb 100%);
        box-shadow: 0 10px 22px rgba(255, 95, 162, 0.14);
        padding: 10px;
      }

      .moment-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .moment-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        max-height: min(46vw, 240px);
        border-radius: 14px;
        border: 2px solid #ffc0de;
        background: repeating-linear-gradient(
          45deg,
          #ffe4f2,
          #ffe4f2 12px,
          #ffd8ea 12px,
          #ffd8ea 24px
        );
        padding: 8px;
        display: grid;
        place-items: center;
      }

      .moment img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 8px;
        background: #fff;
      }

      .moment-actions {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .moment-comments {
        margin-top: 8px;
        font-size: 0.82rem;
        color: #5a3248;
      }

      .floating-heart {
        position: fixed;
        font-size: 24px;
        animation: floatUp 2s ease-out forwards;
        z-index: 30;
      }

      @keyframes floatUp {
        from { transform: translateY(0) scale(1); opacity: 1; }
        to { transform: translateY(-140px) scale(1.2); opacity: 0; }
      }

      @media (min-width: 700px) {
        .app { grid-template-columns: 1fr 1fr; }
        .presence { order: 1; }
        .interaction { order: 2; }
        .moment-frame { max-height: 220px; }
      }

      @media (min-width: 1080px) {
        .app {
          grid-template-columns: minmax(380px, 1.15fr) minmax(460px, 1fr);
          gap: 16px;
          padding: 16px;
        }
        .topbar { padding: 14px 18px; }
        .brand { font-size: 1.4rem; }
        .chat-log { max-height: 300px; }
        .moments { max-height: 420px; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1 class="brand">LoveLink</h1>
      <div id="presence" class="status">Loading presence...</div>
    </div>

    <div id="loginCard" class="login-wrap">
      <div class="card login-card">
        <h2>Private Access</h2>
        <input id="username" class="field" placeholder="Display name" value="Snooky" />
        <input id="password" class="field" type="password" placeholder="Password" />
        <button id="loginBtn" class="btn btn-primary" style="width:100%;">Enter LoveLink</button>
        <p id="loginError" class="error"></p>
      </div>
    </div>

    <main id="appRoot" class="app hidden">
      <section class="card presence">
        <h2>Presence</h2>
        <p id="viewerStatus">Waiting for viewer...</p>

        <div class="video-wrap">
          <video id="localVideo" autoplay playsinline muted class="hidden"></video>
          <video id="remoteVideo" autoplay playsinline class="hidden"></video>
        </div>

        <div class="controls">
          <button id="hostBtn" class="btn btn-primary">I am Agenor (Host)</button>
          <button id="viewerBtn" class="btn btn-secondary">I am Snooky (Viewer)</button>
        </div>

        <div class="quick-actions">
          <button id="captureBtn" class="btn btn-secondary">📸 Capture Moment</button>
          <button id="missYouBtn" class="btn btn-secondary">Send ❤️</button>
        </div>

        <div class="mood-row">
          <select id="moodSelect" class="field" style="margin:0;">
            <option>Miss you</option>
            <option>Watching you</option>
            <option>Thinking of you</option>
            <option>Laughing at you</option>
          </select>
          <button id="sendMoodBtn" class="btn btn-secondary">Send Mood</button>
        </div>

        <div class="eq-wrap">
          <div class="eq-label">Host Mic Equalizer</div>
          <canvas id="hostEq" class="equalizer" width="600" height="120"></canvas>
          <div class="eq-label">Viewer Audio Equalizer</div>
          <canvas id="viewerEq" class="equalizer" width="600" height="120"></canvas>
        </div>
      </section>

      <section class="card interaction">
        <h3>Interaction</h3>
        <div id="typingIndicator" class="typing"></div>
        <div id="chatLog" class="chat-log"></div>

        <div class="composer">
          <input id="chatInput" class="field" placeholder="Say something sweet..." style="margin:0;" />
          <button id="sendBtn" class="btn btn-primary">Send</button>
        </div>

        <div class="reaction-row">
          <button class="btn btn-secondary reactBtn">❤️</button>
          <button class="btn btn-secondary reactBtn">😂</button>
          <button class="btn btn-secondary reactBtn">😍</button>
          <button class="btn btn-secondary reactBtn">🔥</button>
          <button class="btn btn-secondary reactBtn">😴</button>
        </div>

        <h3 style="margin-top:14px;">Memories</h3>
        <div id="moments" class="moments"></div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
